    <h2>Entre Na Lista De Espera!</h2>
            <h3>Fique Por Dentro Do Lançamento.</h3>
    <main>
        <section id="cadastro">
            

            <div class="campo">
                <label for="nome">Nome
                </label>
                <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite Seu Nome"
                required
                >
            </div>
            <div class="campo">
                <label for="Senha">Senha
                </label>
                <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite Sua Senha"
                required
                >
            </div>

            <div class="campo">
                <label for="email">Email
                </label>
                <input 
                type="email"
                id="email"
                name="email"
                placeholder="Digite Seu Email"
                required
                >
            </div>

            <div class="campo">
                <label for="telefone">Telefone (opcional)</label>
            </div>
            <input
            type="tel"
            id="telefone"
            name="telefone"
            placeholder="(21) 90000-0000"
            pattern="\(?\d{2})?\s?\d{5,4}\d{5}\-?\d{4}"
            required
            >
            <section id="cadastre">
            <button type="submit">Cadastrar

            </button>
        </section>
        </section>
    </main>
